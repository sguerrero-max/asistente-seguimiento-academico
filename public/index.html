<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#13426A">
    <title>Asistente de Seguimiento Académico</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand-mark" aria-hidden="true">ASA</div>
        <div>
          <p class="eyebrow">Coordinación de Negocios y Mercadotecnia</p>
          <h1>Asistente de Seguimiento Académico</h1>
          <p class="subtitle">Análisis y seguimiento de solicitudes</p>
        </div>
      </header>

      <section class="notice" aria-label="Aviso importante">
        <span class="notice-mark" aria-hidden="true">!</span>
        <p>Las fichas son propuestas generadas con IA y requieren revisión de la coordinación.</p>
      </section>

      <section class="conversation-panel" aria-label="Conversación con el asistente">
        <div
          id="conversation"
          class="conversation"
          role="log"
          aria-label="Mensajes de la conversación"
          aria-live="polite"
          aria-relevant="additions text"
        ></div>

        <form id="message-form" class="composer">
          <label for="message">Escriba o pegue una solicitud</label>
          <textarea
            id="message"
            name="message"
            rows="4"
            maxlength="2000"
            aria-describedby="message-help character-count"
            placeholder="Describa la solicitud o agregue una aclaración…"
            required
          ></textarea>
          <div class="composer-meta">
            <p id="message-help">Use Ctrl + Enter o Cmd + Enter para enviar. Enter agrega una línea.</p>
            <p id="character-count" class="character-count" aria-live="off">0 / 2000</p>
          </div>
          <div class="composer-actions">
            <button id="new-conversation" class="button button-secondary" type="button">
              Nueva conversación
            </button>
            <button id="send-button" class="button button-primary" type="submit">
              Enviar
            </button>
          </div>
          <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
  </body>
</html>
